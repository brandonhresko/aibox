name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Bash scripts
        # Milestone 1 gates warnings and errors. The inherited v2 code has a
        # few information-level findings in code removed during milestone 2.
        run: shellcheck --shell=bash --severity=warning bin/aibox scripts/*.sh
